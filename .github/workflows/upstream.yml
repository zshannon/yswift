name: Upstream updates

on:
  schedule:
    - cron: '23 17 * * 1' # Mondays, 17:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream.yml'
      - '.github/workflows/build.yml'
      - 'scripts/update-yrs.py'
      - 'scripts/test-update-yrs.py'

permissions:
  contents: read

concurrency:
  group: upstream-updates
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.actions.enableWorkflow({ ...context.repo, workflow_id: 'upstream.yml' });

  yswift:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request: ${{ steps.check.outputs.pull-request }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # This job only manipulates source as data. Validation runs without write access.
      - name: Open or update published YSwift pull request
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const base = context.payload.repository.default_branch;
            const statePath = '.github/upstream-yswift.json';
            const previous = fs.existsSync(statePath) ? JSON.parse(fs.readFileSync(statePath, 'utf8')) : null;
            const { data: release } = await github.rest.repos.getLatestRelease({ owner: 'y-crdt', repo: 'yswift' });
            if (release.draft || release.prerelease) throw new Error('Expected a published stable YSwift release.');
            const { data: commit } = await github.rest.repos.getCommit({ owner: 'y-crdt', repo: 'yswift', ref: release.tag_name });
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${previous?.revision || base}...${commit.sha}`
            });
            if (!comparison.ahead_by) {
              core.info(`Published YSwift ${release.tag_name} is already imported.`);
              return;
            }
            await exec.exec('git', ['fetch', '--no-tags', 'https://github.com/y-crdt/yswift.git', commit.sha]);
            const baseline = previous?.revision || (await exec.getExecOutput('git', ['merge-base', 'HEAD', commit.sha])).stdout.trim();
            const patch = await exec.getExecOutput('git', ['diff', '--binary', baseline, commit.sha, '--', '.', ':(exclude).github/workflows'], { silent: true });
            const patchPath = `${process.env.RUNNER_TEMP}/yswift-release.patch`;
            fs.writeFileSync(patchPath, patch.stdout);
            let conflicts = '';
            if (patch.stdout) {
              const result = await exec.exec('git', ['apply', '--3way', '--index', patchPath], { ignoreReturnCode: true });
              conflicts = (await exec.getExecOutput('git', ['diff', '--name-only', '--diff-filter=U'])).stdout.trim();
              if (result && !conflicts) throw new Error('Unable to apply the published release delta.');
            }
            fs.writeFileSync(statePath, JSON.stringify({ revision: commit.sha, version: release.tag_name }, null, 2) + '\n');
            const native = await exec.exec('git', ['diff', '--quiet', 'HEAD', '--', 'lib/src', 'lib/vendor/yrs', 'lib/Cargo.toml', 'lib/Cargo.lock', 'lib/swift/scaffold'], { ignoreReturnCode: true });
            if (native) {
              const manifest = fs.readFileSync('Package.swift', 'utf8')
                .replace(/^let binaryURL: String\? = .*$/m, 'let binaryURL: String? = nil')
                .replace(/^let binaryChecksum = .*$/m, 'let binaryChecksum = ""');
              fs.writeFileSync('Package.swift', manifest);
            }
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', '--all']);
            await exec.exec('git', ['commit', '-m', `Import published YSwift ${release.tag_name}`]);
            const branch = 'codex/yswift-upstream';
            await exec.exec('git', ['push', '--force', 'origin', `HEAD:refs/heads/${branch}`]);
            const head = `${repo.owner}:${branch}`;
            const { data: existing } = await github.rest.pulls.list({ ...repo, base, head, state: 'open' });
            const title = `Import published YSwift ${release.tag_name}`;
            const body = `Import [YSwift ${release.tag_name}](${release.html_url}) at ${commit.sha}.\n\n` +
              `[Upstream changes](${comparison.html_url}). Fork-owned CI workflows are retained.\n\n` +
              (conflicts ? `Resolve these merge conflicts:\n\n${conflicts}\n\n` : 'No source merge conflicts.\n\n') +
              `Native and Swift validation: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}. ` +
              'Review the source changes and validation before marking this draft ready. This workflow never merges automatically.';
            const { data: pr } = existing.length
              ? await github.rest.pulls.update({ ...repo, pull_number: existing[0].number, title, body })
              : await github.rest.pulls.create({ ...repo, base, head, title, body, draft: true });
            if (!pr.draft) await github.graphql('mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { id } } }', { id: pr.node_id });
            await github.rest.issues.addAssignees({ ...repo, issue_number: pr.number, assignees: [repo.owner] });
            core.setOutput('pull-request', pr.number);
            await core.summary.addLink(`YSwift PR #${pr.number}`, pr.html_url).write();

  validate-yswift:
    needs: yswift
    if: needs.yswift.outputs.pull-request != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/pull/${{ needs.yswift.outputs.pull-request }}/merge

  prepare-yrs:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      validation: ${{ steps.validate.outcome }}
    env:
      YSWIFT_LOCAL: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check published Yrs releases
        id: check
        run: python3 scripts/update-yrs.py --discover
      - name: Import Yrs and rebase the undo fix
        id: update
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          python3 scripts/test-update-yrs.py
          python3 scripts/update-yrs.py --update
      - name: Validate native and Swift changes
        id: validate
        if: steps.check.outputs.changed == 'true' && steps.update.outcome == 'success' && steps.update.outputs.conflicts == 'false'
        continue-on-error: true
        run: |
          xcodebuild -version
          ./scripts/build-xcframework.sh
          cargo test --manifest-path lib/Cargo.toml --locked
          swift build
          swift test --enable-code-coverage -v
      - name: Record validation result
        if: always() && steps.check.outputs.changed == 'true'
        env:
          IMPORT_RESULT: ${{ steps.update.outcome }}
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\nImport: **%s**. Native and Swift validation: **%s**.\n\n[Workflow logs](%s).\n' "$IMPORT_RESULT" "$VALIDATION_RESULT" "$RUN_URL" >> "$RUNNER_TEMP/yswift-upstream-pr.md"
      - name: Export update for publishing on a fresh runner
        if: always() && steps.check.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/yrs-update"
          git add -- .github/upstream-yrs*.json Package.swift Package.resolved lib/Cargo.toml lib/Cargo.lock lib/vendor lib/swift/scaffold
          git diff --cached --binary > "$RUNNER_TEMP/yrs-update/update.patch"
          cp "$RUNNER_TEMP/yswift-upstream-pr.md" "$RUNNER_TEMP/yrs-update/body.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.check.outputs.changed == 'true'
        with:
          name: yrs-update
          path: ${{ runner.temp }}/yrs-update
          retention-days: 7
          if-no-files-found: error

  publish-yrs:
    needs: prepare-yrs
    if: always() && needs.prepare-yrs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: yrs-update
          path: ${{ runner.temp }}/yrs-update
      # Never execute imported code in this job. Only these paths may be changed.
      - name: Apply the prepared update
        run: |
          git apply --index --include='.github/upstream-yrs*.json' --include='Package.swift' --include='Package.resolved' --include='lib/Cargo.toml' --include='lib/Cargo.lock' --include='lib/vendor/*' --include='lib/swift/scaffold/*' "$RUNNER_TEMP/yrs-update/update.patch"
      - name: Commit prepared release update
        env:
          BRANCH: codex/yrs-upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update vendored Yrs to latest stable release'
          git push --force origin "HEAD:refs/heads/$BRANCH"
      - name: Open or update Yrs pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VALIDATION: ${{ needs.prepare-yrs.outputs.validation }}
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const base = context.payload.repository.default_branch;
            const head = `${repo.owner}:codex/yrs-upstream`;
            const title = 'Update vendored Yrs to latest stable release';
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/yrs-update/body.md`, 'utf8');
            const { data: existing } = await github.rest.pulls.list({ ...repo, base, head, state: 'open' });
            const draft = process.env.VALIDATION !== 'success';
            const { data: pr } = existing.length
              ? await github.rest.pulls.update({ ...repo, pull_number: existing[0].number, title, body })
              : await github.rest.pulls.create({ ...repo, base, head, title, body, draft });
            if (draft && !pr.draft) await github.graphql('mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { id } } }', { id: pr.node_id });
            await github.rest.issues.addAssignees({ ...repo, issue_number: pr.number, assignees: [repo.owner] });
            await core.summary.addLink(`Yrs PR #${pr.number}`, pr.html_url).write();
      - name: Report failed update validation
        if: needs.prepare-yrs.outputs.validation != 'success'
        run: |
          echo '::error::The Yrs update needs attention. See the draft pull request and preceding logs.'
          exit 1
